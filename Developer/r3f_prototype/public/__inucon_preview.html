<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inucon R3F Preview</title>
  <style>
    html, body, #root { margin: 0; width: 100%; height: 100%; background: #15251b; overflow: hidden; }
    .label { position: fixed; left: 18px; top: 14px; color: white; font: 700 20px system-ui, sans-serif; text-shadow: 0 2px 8px #000; z-index: 2; }
  </style>
</head>
<body>
  <div class="label">이누콘 R3F 모델 프리뷰 — 세로형 강아지 동반자</div>
  <div id="root"></div>
  <!-- public/ HTML은 Vite가 변환하지 않아 React Refresh 프리앰블이 없다. 게임 컴포넌트(Inucon.jsx)를 불러오려면 직접 넣는다. -->
  <script type="module">
    import RefreshRuntime from '/@react-refresh'
    RefreshRuntime.injectIntoGlobalHook(window)
    window.$RefreshReg$ = () => {}
    window.$RefreshSig$ = () => (type) => type
    window.__vite_plugin_react_preamble_installed__ = true
  </script>
  <script type="module" src="/src/inuconPreview.jsx"></script>
</body>
</html>
